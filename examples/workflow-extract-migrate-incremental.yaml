# Full sync: extract + migrate (no incremental)
# Run this FIRST to create the sync manifest. Then use workflow-nick-jordan-incremental.yaml
# to test incremental (re-extract + migrate with --incremental).

workflow:
  steps:
    - extract-source
    - migrate

source:
  projectKey:
  domain: app.launchdarkly.com

destination:
  projectKey:
  domain: app.launchdarkly.com

extraction:
  includeSegments: true

migration:
  migrateSegments: true
  assignMaintainerIds: false

  # Re-export and re-import big segment members (optional). Big segments with exported
  # members are re-imported on every run, since member changes may not bump the version.
  # migrateBigSegments: true

  # Preview without writing (optional); a dry run does not update the sync manifest
  # dryRun: true

  # Include only these flag keys (optional — omit to migrate all)
  # includeFlags:
  #   - feature-one
  #   - feature-two

  # Exclude these flag keys (optional)
  # excludeFlags:
  #   - deprecated-flag

  # Migrate up to N flags in parallel (optional, default: 10)
  # concurrency: 10

  incremental: true # Only sync flags/segments changed since last run

# A flag archived in the source since it was migrated is archived in the destination too
# (default: true). Flags deleted in the source are reported; their copies are kept.
# propagateArchived: false
