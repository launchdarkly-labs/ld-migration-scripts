# Complete LaunchDarkly Migration Workflow
# Runs all steps: extract source → map members → migrate
# This is the DEFAULT behavior if workflow.steps is not specified

# Optional: Explicitly define steps (if omitted, runs all steps by default)
# workflow:
#   steps:
#     - extract-source
#     - map-members
#     - migrate

source:
  projectKey: us-production
  domain: app.launchdarkly.com # Optional: Defaults to app.launchdarkly.com

destination:
  projectKey: eu-production
  domain: app.launchdarkly.com # Optional: Use app.eu.launchdarkly.com for EU instance

# Optional: Control what data to extract from source
# extraction:
#   includeSegments: true  # Uncomment to extract segments (only needed if migrateSegments: true)

# Optional: Configure member mapping output location
memberMapping:
  outputFile: data/launchdarkly-migrations/mappings/maintainer_mapping.json

# Migration configuration
migration:
  # Use the member mapping we just created
  assignMaintainerIds: true

  # Include segments
  migrateSegments: true

  # Copy big (larger list-based) segment members via CSV export/import (optional, default: false).
  # Needs createSegmentExport on the source token (see docs/launchdarkly-migration-role.md).
  # migrateBigSegments: true

  # Recreate the source project's views and link flags/segments to them (optional, default: true)
  # migrateViews: false

  # Preview without writing to the destination (optional, recommended for the first run)
  # dryRun: true

  # Handle conflicts
  conflictPrefix: "us-"

  # Add these tags to migrated flags and segments (optional)
  # tags:
  #   - imported-from-us
  #   - legacy-project

  # Organize in view
  targetView: "us-migration-2024"

  # Only migrate these environments
  environments:
    - production
    - staging

  # Map environment keys if needed
  environmentMapping:
    production: production
    staging: staging

  # Include only these flag keys (optional — omit to migrate all).
  # Their prerequisite flags must be included too or already exist in the destination;
  # a real run stops before writing if one is missing, a dry run warns.
  # includeFlags:
  #   - feature-one
  #   - feature-two

  # Exclude these flag keys (optional)
  # excludeFlags:
  #   - deprecated-flag

  # Migrate up to N flags in parallel (optional, default: 10)
  # concurrency: 10
