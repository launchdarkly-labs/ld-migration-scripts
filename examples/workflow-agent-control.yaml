# Workflow with AgentControl (AI Configs) extract + migrate
# REST paths remain under /ai-configs; product name is AgentControl.
#
# Extract runs when includeAgentControl OR migrateAgentControl is true.
# Migrate is opt-in (default false) and runs:
#   model-configs → configs → variations → targeting
#
# Run:  deno task workflow -f examples/workflow-agent-control.yaml
# Start with dryRun: true; a dry run reads the destination but writes nothing
# and does not write the sync manifest.

source:
  projectKey: replace-with-project-key
  domain: app.launchdarkly.com

destination:
  projectKey: replace-with-project-key
  domain: app.launchdarkly.com
  # projectName: Display Name # Used only when createProject creates the project

extraction:
  includeSegments: false
  includeAgentControl: true

migration:
  migrateSegments: false
  migrateAgentControl: true
  dryRun: true # Preview AgentControl writes without applying; set to false to apply

  # Create the destination project / environments when missing
  # createProject: true
  # createEnvironments: true

  # Skip configs, variations and targeting whose content is unchanged since the last sync
  # (compared by content hash in the sync manifest; --since does not apply to AgentControl).
  # A config the destination no longer has is rewritten.
  # incremental: true

  # What to do with a config or model config that already exists in the destination and was not
  # written by an earlier run: overwrite | skip | prefix | abort | prompt.
  # Default: prefix when conflictPrefix is set, otherwise overwrite.
  # With prefix, a config becomes <prefix><key> and its variations and targeting follow it;
  # an existing model config is reused (variations refer to it by key).
  # onConflict: skip
  # conflictPrefix: "mig-"

  # Tags added to migrated configs and model configs (variations take no tags)
  # tags:
  #   - migrated

  # Map member maintainers through maintainer_mapping.json (run the map-members step first);
  # unmapped maintainers and team maintainers are not carried over
  assignMaintainerIds: false

  # Map source environment keys to destination environment keys for targeting
  # environmentMapping:
  #   production: prod

  # Map source model keys to destination model keys, for models the destination offers under another
  # key (a custom model's key carries generated text, and the Federal catalog lacks some built-ins).
  # Variations are written with the mapped key, and mapped source models are not created. A run that
  # finds a missing model lists destination models that look like it, with a mapping to paste here.
  # agentControlModelMapping:
  #   "Gemini.gemini-2.5-flash": "Gemini.gemini-2.5-flash-custom-1a2b"

  # A default rule serving a variation that cannot be migrated (its model is missing) is reported as
  # an error either way. leave (default): the destination keeps serving what it serves, which for a new
  # config can be another variation. disabled: the default rule serves the disabled variation instead.
  # agentControlUnmappedDefaultRule: disabled
